<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>FEE-XMD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1a0f00; /* Dark orange/black background */
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .box {
      width: 320px;
      padding: 20px;
      background-color: rgba(26, 15, 0, 0.85); /* Dark orange/black with transparency */
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 25px #ff7b00, 0 0 15px rgba(255, 123, 0, 0.3); /* Orange glow */
      z-index: 2;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 123, 0, 0.2);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; text-shadow: 0 0 5px #ff7b00, 0 0 20px #ff7b00; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    h3, h6 {
      color: #ff7b00; /* Orange color */
      animation: flicker 3s infinite alternate;
      margin: 10px 0;
      text-shadow: 0 0 10px rgba(255, 123, 0, 0.3);
    }

    .input-container {
      display: flex;
      width: 100%;
      margin-top: 15px;
    }

    .input-container input,
    .input-container button {
      height: 3rem;
      font-size: 1rem;
      border: none;
      outline: none;
      box-sizing: border-box;
      transition: none !important;
      transform: none !important;
      resize: none !important;
      appearance: none;
    }

    .input-container input {
      width: 70%;
      border-radius: 0.8rem 0 0 0.8rem;
      background: #ffe6cc; /* Light orange background */
      color: #331a00; /* Dark orange text */
      padding-left: 1rem;
      border: 1px solid #ff7b00;
      font-weight: bold;
    }

    .input-container button {
      width: 30%;
      border-radius: 0 0.8rem 0.8rem 0;
      background: linear-gradient(to right, #ff7b00, #ff9900); /* Orange gradient */
      color: #331a00; /* Dark text */
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ff7b00;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
      transition: background 0.3s ease !important;
    }

    .input-container button:hover {
      background: linear-gradient(to right, #ff9900, #ffaa33); /* Brighter orange gradient */
      color: #000;
      box-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
    }

    a.centered-text {
      color: #ffcc99; /* Light orange text */
      display: block;
      margin-top: 20px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    /* Video background with orange overlay */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.4;
      filter: sepia(0.7) hue-rotate(-10deg) saturate(1.5); /* Make video more orange */
    }

    /* Orange overlay to enhance orange effect */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, rgba(255, 123, 0, 0.1), rgba(255, 69, 0, 0.05));
      z-index: 1;
      pointer-events: none;
    }

    /* Sound control button */
    .sound-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 123, 0, 0.7); /* Orange background */
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 15px #ff7b00, 0 0 5px rgba(255, 123, 0, 0.5);
      transition: all 0.3s;
    }

    .sound-btn:hover {
      background: rgba(255, 153, 0, 0.9);
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff7b00, 0 0 10px rgba(255, 123, 0, 0.7);
    }

    .sound-btn i {
      color: #331a00; /* Dark orange icon */
      font-size: 20px;
      font-weight: bold;
    }

    /* Neon dot overlay - orange */
    .neon-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ff7b00; /* Orange dots */
      border-radius: 50%;
      animation: rise 5s linear infinite;
      opacity: 0.6;
      box-shadow: 0 0 8px #ff7b00;
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0.2;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 1;
      }
    }

    /* User icon styling */
    .fa-user {
      color: #ff7b00 !important;
      text-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
      font-size: 24px;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    /* Custom scrollbar for number input */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Additional styles for messages */
    #waiting-message {
      color: #ffcc66;
      text-shadow: 0 0 5px rgba(255, 204, 102, 0.3);
    }

    /* Code display styling */
    #copy {
      color: #ff9900 !important;
      cursor: pointer;
      padding: 10px;
      border-radius: 5px;
      background: rgba(255, 123, 0, 0.1);
      display: inline-block;
      margin: 10px 0;
      border: 1px solid rgba(255, 123, 0, 0.3);
      transition: all 0.3s ease;
    }

    #copy:hover {
      background: rgba(255, 123, 0, 0.2);
      box-shadow: 0 0 10px rgba(255, 123, 0, 0.3);
    }

    #copy span {
      color: #ffcc99 !important;
    }
  </style>
</head>
<body>
  <!-- Video Background -->
  <video class="video-background" id="bgVideo" autoplay muted loop>
    <source src="https://files.catbox.moe/ppgkqj.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  
  <!-- Orange overlay -->
  <div class="video-overlay"></div>
  
  <!-- Neon dot overlay -->
  <div class="neon-overlay" id="dots"></div>

  <!-- Sound control button -->
  <div class="sound-btn" id="soundBtn">
    <i class="fas fa-volume-mute" id="soundIcon"></i>
  </div>

  <div class="container">
    <div class="box" id="box">
      <div id="text">
        <i class="fa fa-user"></i>
        <h3>FEE XMD MINI</h3>
        <h6>Login fee XMD mini bot in your WhatsApp direct without deploy</h6>
        <h6>🔢 Enter your number with country code</h6>

        <div class="input-container">
          <input placeholder="255752593977" type="number" id="number">
          <button id="submit">SUBMIT</button>
        </div>

        <a id="waiting-message" class="centered-text" style="display: none;">Please wait a while...</a>
        <main id="pair"></main>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");
    const video = document.getElementById("bgVideo");
    const soundBtn = document.getElementById("soundBtn");
    const soundIcon = document.getElementById("soundIcon");

    // Sound control functionality
    soundBtn.addEventListener("click", () => {
      if (video.muted) {
        video.muted = false;
        soundIcon.classList.remove("fa-volume-mute");
        soundIcon.classList.add("fa-volume-up");
      } else {
        video.muted = true;
        soundIcon.classList.remove("fa-volume-up");
        soundIcon.classList.add("fa-volume-mute");
      }
    });

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "COPIED";
      obj.style = "color:#ffcc00;font-weight:bold"; /* Orange-yellow for copied state */
      obj.size = "5";
      setTimeout(() => {
        obj.innerText = text;
        obj.style = "color:#ff9900;font-weight-bold"; /* Back to orange */
        obj.size = "5";
      }, 500);
    }

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerHTML = '<a style="color:#ffcc99;font-weight:bold">Enter your WhatsApp number with Country Code</a><br><br>';
      } else if (c.value.replace(/[^0-9]/g, "").length < 11) {
        a.innerHTML = '<a style="color:#ff3300;font-weight:bold">Invalid Number</a><br><br>';
      } else {
        const number = c.value.replace(/[^0-9]/g, "");
        c.type = "text";
        c.value = "+" + number;
        c.style = "color:#331a00;font-size:20px;font-weight:bold"; /* Dark orange text */
        a.innerHTML = '<a style="color:#ffcc99;font-weight:bold">Please Wait...</a><br><br>';
        let { data } = await axios(`/code?number=${number}`);
        let code = data.code || "Service Unavailable";
        a.innerHTML = `<font id="copy" onclick="Copy()" style="color:#ff9900;font-weight:bold" size="5">CODE: <span style="color:#ffcc99;">${code}</span></font><br><br><br>`;
      }
    });

    // Dot animation - increase number of dots for richer effect
    const bg = document.getElementById("dots");
    for (let i = 0; i < 100; i++) {
      const dot = document.createElement("div");
      dot.classList.add("dot");
      dot.style.left = Math.random() * 100 + "vw";
      dot.style.animationDuration = 3 + Math.random() * 5 + "s";
      dot.style.animationDelay = Math.random() * 5 + "s";
      // Add some variation in orange colors
      const orangeShade = Math.floor(200 + Math.random() * 55);
      dot.style.background = `rgb(255, ${Math.floor(100 + Math.random() * 60)}, 0)`;
      bg.appendChild(dot);
    }
  </script>
</body>
</html>
