<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fee-Mini-Bot | Official Pairing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://files.catbox.moe/1u44r5.jpeg">
    <meta name="theme-color" content="#ff6b00">
    <meta name="description" content="WhatsApp Mimi bot by Fredi.E.Ezra from Tanzania">
    <meta name="keywords" content="Free_bot, fredi_AI, fee-xmd device, bots, WhatsApp">
    <meta name="author" content="Fredi.E.Ezra">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        /* System Theme Detection - Light Mode */
        @media (prefers-color-scheme: light) {
            :root {
                --primary: #f97316; /* Orange */
                --secondary: #ea580c; /* Darker Orange */
                --success: #10b981;
                --dark: #f8fafc; /* Light background */
                --glass: rgba(255, 255, 255, 0.9); /* Less transparent */
                --border: rgba(0, 0, 0, 0.1);
                --text: #1e293b;
                --text-light: #64748b;
            }
            body { 
                background: var(--dark);
                color: var(--text);
            }
            .card {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
                border: 1px solid rgba(0, 0, 0, 0.08);
            }
            h1 {
                background: linear-gradient(to right, #1e293b, var(--primary));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .input-box {
                background: rgba(255, 255, 255, 0.9);
                color: var(--text);
            }
            input {
                color: var(--text);
            }
            .step {
                color: var(--text-light);
            }
            .footer {
                color: var(--text-light);
            }
        }

        /* System Theme Detection - Dark Mode (Default) */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #f97316; /* Orange */
                --secondary: #ea580c; /* Darker Orange */
                --success: #00ff88;
                --dark: #05070a;
                --glass: rgba(255, 255, 255, 0.03);
                --border: rgba(255, 255, 255, 0.1);
                --text: #fff;
                --text-light: #a0aec0;
            }
        }

        :root {
            /* Fallback variables */
            --primary: #f97316;
            --secondary: #ea580c;
            --success: #00ff88;
            --dark: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-light: #a0aec0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Outfit', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background: var(--dark); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            overflow-x: hidden; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glow-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.12), transparent 70%); 
        }

        /* Fancy Notification Toast */
        #toast {
            position: fixed; 
            top: -100px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.95); 
            backdrop-filter: blur(15px);
            border: 1px solid var(--primary); 
            border-radius: 20px; 
            padding: 15px 30px;
            display: flex; 
            align-items: center; 
            gap: 12px; 
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(249, 115, 22, 0.3); 
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            width: max-content; 
            max-width: 90%;
        }
        #toast.show { top: 30px; }

        .container { width: 100%; max-width: 450px; position: relative; }

        .card { 
            background: var(--glass); 
            backdrop-filter: blur(30px); 
            border: 1px solid var(--border); 
            border-radius: 40px; 
            padding: clamp(25px, 5vw, 40px); 
            box-shadow: 0 40px 100px rgba(0,0,0,0.7); 
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.15); 
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Stats Layer */
        .stats { display: flex; gap: 12px; margin-bottom: 25px; }
        .stat-item { 
            flex: 1; 
            background: rgba(255,255,255,0.02); 
            padding: 15px; 
            border-radius: 22px; 
            border: 1px solid var(--border); 
            transition: background-color 0.3s ease;
        }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: block; }
        .stat-lbl { font-size: 0.6rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; }

        .logo-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .logo { width: 85px; height: 85px; border-radius: 22px; border: 2px solid var(--border); animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        h1 { 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
            margin-bottom: 5px; 
            background: linear-gradient(to right, var(--text), var(--primary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .status-badge { 
            background: rgba(16, 185, 129, 0.1); 
            color: var(--success); 
            padding: 6px 15px; 
            border-radius: 50px; 
            font-size: 0.7rem; 
            font-weight: 700; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            margin-bottom: 25px;
        }
        .dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .input-view-title { 
            font-size: 0.85rem; 
            color: var(--primary); 
            font-weight: 600; 
            margin-bottom: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .input-box { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--border); 
            border-radius: 22px; 
            padding: 18px 25px; 
            margin-bottom: 20px; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 15px;
        }
        .input-box:focus-within { 
            border-color: var(--primary); 
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.15); 
        }
        input { 
            background: transparent; 
            border: none; 
            color: var(--text); 
            width: 100%; 
            outline: none; 
            font-size: 1.1rem; 
            font-weight: 600; 
        }

        .btn { 
            width: 100%; 
            padding: 20px; 
            border-radius: 22px; 
            border: none; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            font-weight: 800; 
            font-size: 0.95rem; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 15px 30px rgba(249, 115, 22, 0.2);
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .btn:hover { 
            transform: scale(1.02); 
            filter: brightness(1.1); 
        }

        .code-display { 
            font-size: clamp(2.2rem, 8vw, 3rem); 
            font-family: monospace; 
            color: var(--success); 
            letter-spacing: 8px; 
            margin: 25px 0; 
            padding: 25px; 
            font-weight: bold;
            background: rgba(16, 185, 129, 0.03); 
            border: 2px dashed rgba(16, 185, 129, 0.2); 
            border-radius: 25px;
        }

        .instructions {
            margin-top: 35px; 
            text-align: left; 
            background: rgba(255,255,255,0.02);
            padding: 20px; 
            border-radius: 25px; 
            border: 1px solid var(--border);
            transition: background-color 0.3s ease;
        }
        .step { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 12px; 
            font-size: 0.8rem; 
            color: var(--text-light); 
            line-height: 1.4; 
        }
        .step i { 
            color: var(--primary); 
            margin-top: 2px; 
        }

        .loader { 
            display: none; 
            padding: 40px 0; 
        }
        .spinner { 
            width: 50px; 
            height: 50px; 
            border: 4px solid rgba(255,255,255,0.05); 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            margin: 0 auto; 
        }
        @keyframes spin { 
            to { 
                transform: rotate(360deg); 
            } 
        }

        .footer { 
            margin-top: 40px; 
            font-size: 0.7rem; 
            color: var(--text-light); 
            letter-spacing: 1px; 
            text-align: center; 
        }

        /* Theme indicator for debugging */
        .theme-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 0.6rem;
            padding: 4px 8px;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            opacity: 0.7;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <!-- Theme indicator (optional, can be removed) -->
    <div class="theme-indicator" id="themeIndicator">System Theme</div>
    
    <div id="toast"><i class="fas fa-check-circle"></i><span id="toast-msg">Success</span></div>

    <div class="container">
        <div class="card">
            <div class="stats">
                <div class="stat-item"><span class="stat-val" id="active">..</span><span class="stat-lbl">Active</span></div>
                <div class="stat-item"><span class="stat-val" id="total">..</span><span class="stat-lbl">Sessions</span></div>
            </div>

            <div class="logo-wrapper">
                <img src="https://raw.githubusercontent.com/Fred1e/FEE-XMD/main/mini.png" class="logo">
            </div>

            <h1>Fee-Mini-Bot</h1>
            <div class="status-badge"><div class="dot"></div> SYSTEM ONLINE</div>

            <div id="inputView">
                <p class="input-view-title">Enter number with country code</p>
                <div class="input-box">
                    <i class="fas fa-globe" style="color: var(--text-light)"></i>
                    <input type="tel" id="num" placeholder="e.g. 255752593977" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <button class="btn" onclick="getPair()">Generate Code</button>
            </div>

            <div id="loading" class="loader">
                <div class="spinner"></div>
                <p style="margin-top:20px; font-size: 0.8rem; color: var(--primary); font-weight: 600;">ESTABLISHING LINK...</p>
            </div>

            <div id="resultView" style="display:none">
                <div class="code-display" id="code">------</div>
                <button class="btn" onclick="copy()">Copy & Link Now</button>
            </div>

            <div class="instructions">
                <div class="step"><i class="fas fa-cog"></i><span>Open <b>WhatsApp Settings</b></span></div>
                <div class="step"><i class="fas fa-laptop"></i><span>Select <b>Linked Devices</b></span></div>
                <div class="step"><i class="fas fa-phone"></i><span>Tap <b>Link with phone number</b></span></div>
            </div>
        </div>

        <div class="footer">
            xD<br>
            漏 <b>饾惐饾悺_饾悳饾惀饾悽饾惂饾惌饾惃饾惂</b>
        </div>
    </div>

    <script>
        // HARDCODED HEROKU LINK
        const HEROKU_URL = 'https://fee-mini-bot-8f2480a7aaae.herokuapp.com';
        const API = `${HEROKU_URL}/code`;

        // Theme detection
        function updateThemeIndicator() {
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const themeIndicator = document.getElementById('themeIndicator');
            if (themeIndicator) {
                themeIndicator.textContent = isDarkMode ? 'Dark Mode' : 'Light Mode';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function fetchStats() {
            try {
                const r = await fetch(`${API}/api/active`);
                const d = await r.json();
                document.getElementById('active').innerText = d.count || 0;
                document.getElementById('total').innerText = d.total || 0;
            } catch(e) {}
        }

        async function getPair() {
            const n = document.getElementById('num').value;
            if(n.length < 8) return showToast("Invalid Number!");

            document.getElementById('inputView').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const r = await fetch(`${API}/?number=${n}`);
                const d = await r.json();
                if(d.code) {
                    document.getElementById('code').innerText = d.code;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('resultView').style.display = 'block';
                    showToast("Code Generated!");
                } else {
                    throw new Error();
                }
            } catch(e) { 
                showToast("System Busy. Retrying..."); 
                setTimeout(() => location.reload(), 2000);
            }
        }

        function copy() {
            const c = document.getElementById('code').innerText;
            navigator.clipboard.writeText(c).then(() => {
                showToast("Code Copied! Redirecting...");
                
                // Fancy Reset Logic
                setTimeout(() => {
                    document.getElementById('resultView').style.display = 'none';
                    document.getElementById('inputView').style.display = 'block';
                    document.getElementById('num').value = '';
                }, 2500);
            });
        }

        window.onload = () => {
            fetchStats();
            setInterval(fetchStats, 15000);
            updateThemeIndicator();
            
            // Listen for theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeIndicator);
        };
    </script>
</body>
</html>
